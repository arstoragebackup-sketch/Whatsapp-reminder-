const admin = require("firebase-admin");

// Helper function to safely clean and format the private key from GitHub Secrets
const formatPrivateKey = (key) => {
  if (!key) return "";
  return key.trim().replace(/^["']|["']$/g, "").replace(/\\n/g, "\n");
};

// HARDCODED CONFIGURATION FROM YOUR FIREBASE SERVICE ACCOUNT
const projectId = "clinic-appointment-reminder";
const clientEmail = "firebase-adminsdk-fbsvc@clinic-appointment-reminder.iam.gserviceaccount.com";

// SECRETS LOADED FROM GITHUB ACTIONS
const rawPrivateKey = process.env.FIREBASE_PRIVATE_KEY;
const whatsappToken = process.env.WHATSAPP_TOKEN;
const phoneNumberId = process.env.PHONE_NUMBER_ID;

console.log("=== CLINIC REMINDER SYSTEM DIAGNOSTIC ===");
console.log("Project ID set:", projectId);
console.log("Client Email set:", clientEmail);
console.log("Private Key Length:", rawPrivateKey ? rawPrivateKey.length : 0);
console.log("=========================================");

if (!rawPrivateKey || !whatsappToken || !phoneNumberId) {
  console.error("Fatal Error: Missing required secrets (Private Key, WhatsApp Token, or Phone ID) in GitHub Actions.");
  process.exit(1);
}

// Initialize Firebase Admin SDK
if (!admin.apps.length) {
  try {
    admin.initializeApp({
      credential: admin.credential.cert({
        projectId: projectId,
        clientEmail: clientEmail,
        privateKey: formatPrivateKey(rawPrivateKey),
      }),
    });
    console.log("Firebase Admin initialized successfully.");
  } catch (error) {
    console.error("Failed to initialize Firebase Admin:", error.message);
    process.exit(1);
  }
}

const db = admin.firestore();

async function sendWhatsAppMessage(phone, message) {
  const url = `https://graph.facebook.com/v18.0/${phoneNumberId}/messages`;

  const response = await fetch(url, {
    method: "POST",
    headers: {
      Authorization: `Bearer ${whatsappToken}`,
      "Content-Type": "application/json",
    },
    body: JSON.stringify({
      messaging_product: "whatsapp",
      to: phone,
      type: "text",
      text: { body: message },
    }),
  });

  const data = await response.json();
  if (!response.ok) {
    throw new Error(`WhatsApp API Error (${response.status}): ${JSON.stringify(data)}`);
  }
  return data;
}

async function processReminders() {
  console.log("Checking Firestore for pending reminders...");
  const now = admin.firestore.Timestamp.now();

  try {
    // Query reminders where sent is not true and reminderTime is due
    const snapshot = await db
      .collection("reminders")
      .where("sent", "!=", true)
      .where("reminderTime", "<=", now)
      .get();

    if (snapshot.empty) {
      console.log("No pending reminders due at this time.");
      return;
    }

    console.log(`Found ${snapshot.size} reminder(s) ready to send.`);

    for (const doc of snapshot.docs) {
      const data = doc.data();
      const phone = data.phone;
      const message = data.message;

      if (!phone || !message) {
        console.warn(`Skipping document ${doc.id}: Missing 'phone' or 'message' field.`);
        continue;
      }

      try {
        console.log(`Sending reminder to ${phone} (Doc ID: ${doc.id})...`);
        await sendWhatsAppMessage(phone, message);

        // Mark as sent in Firestore
        await doc.ref.update({
          sent: true,
          sentAt: admin.firestore.FieldValue.serverTimestamp(),
        });
        console.log(`Successfully sent and marked reminder ${doc.id} as sent.`);
      } catch (err) {
        console.error(`Failed to send reminder ${doc.id}:`, err.message);
      }
    }
  } catch (error) {
    console.error("Error querying Firestore collection:", error.message);
    throw error;
  }
}

// Execute the script
processReminders()
  .then(() => {
    console.log("Reminder check completed successfully.");
    process.exit(0);
  })
  .catch((error) => {
    console.error("Unhandled fatal error during execution:", error);
    process.exit(1);
  });
  
